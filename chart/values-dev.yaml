replicaCount: 1
instanceName: dev
imageRegistry: ghcr.io
imageRepository: ncar/chemistry-cafe
imageTag: a27b3bb
imagePullPolicy: Always
mysql:
  image:
    repository: docker.io/mysql
    tag: 9.7.2
  persistence:
    enabled: false
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
backend:
  frontendHost: https://chemcafe-dev.k8s.ucar.edu
  # The ingress keeps the path prefix, and the auth routes are at /auth,
  # not /api/auth. The backend uses this value only for the OAuth redirect.
  backendBaseUrl: /
  env:
    ASPNETCORE_ENVIRONMENT: Production
    SEED_DATABASE: "true"
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
frontend:
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 128Mi
      cpu: 200m
ingress:
  enabled: true
  className: traefik-internal
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    cert-manager.io/cluster-issuer: incommon
  hosts:
    - host: chemcafe-dev.k8s.ucar.edu
      paths:
        - path: /
          pathType: Prefix
          backendService: frontend
        - path: /api
          pathType: Prefix
          backendService: backend
        - path: /auth
          pathType: Prefix
          backendService: backend
        # Google sends the user here after sign-in (the ASP.NET default CallbackPath)
        - path: /signin-google
          pathType: Prefix
          backendService: backend
        # ORCID sends the user here after sign-in (CallbackPath in Program.cs)
        - path: /signin-orcid
          pathType: Prefix
          backendService: backend
  tls:
    - secretName: chemistry-cafe-dev-tls
      hosts:
        - chemcafe-dev.k8s.ucar.edu
externalSecrets:
  secretStoreName: kshores-ro
  baoUser: kshores@ucar.edu
