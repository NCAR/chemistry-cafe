{{- /*
External Secrets for fetching secrets from BAO vault.
Secrets are stored at: kv/kshores@ucar.edu/chemistry-cafe-{release-name}
This allows separate dev, staging, and prod instances to use different secrets.
*/ -}}
{{- $baoUser := .Values.externalSecrets.baoUser | default "kshores@ucar.edu" }}
{{- $releaseName := .Release.Name | lower }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "chemistry-cafe.fullname" . }}-mysql
  labels:
    {{- include "chemistry-cafe.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ include "chemistry-cafe.fullname" . }}-mysql
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: {{ $baoUser | lower }}/chemistry-cafe-{{ .Values.instanceName }}
        property: MYSQL_ROOT_PASSWORD
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: {{ $baoUser | lower }}/chemistry-cafe-{{ .Values.instanceName }}
        property: MYSQL_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "chemistry-cafe.fullname" . }}-backend
  labels:
    {{- include "chemistry-cafe.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ include "chemistry-cafe.fullname" . }}-backend
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: {{ $baoUser | lower }}/chemistry-cafe-{{ .Values.instanceName }}
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: {{ $baoUser | lower }}/chemistry-cafe-{{ .Values.instanceName }}
        property: GOOGLE_CLIENT_SECRET