{{- /*
External Secrets for fetching secrets from BAO vault.
Secrets are stored at: kv/{baoUser}/chemistry-cafe-{instanceName}
This allows separate dev, staging, and prod instances to use different secrets.
*/ -}}
{{- $baoUser := .Values.externalSecrets.baoUser | default "kshores@ucar.edu" }}
{{- $instanceName := .Values.instanceName | default "dev" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "chemistry-cafe.name" . }}-mysql
  labels:
    {{- include "chemistry-cafe.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ include "chemistry-cafe.name" . }}-mysql
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: {{ $baoUser }}/chemistry-cafe-{{ $instanceName }}
        property: MYSQL_ROOT_PASSWORD
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: {{ $baoUser }}/chemistry-cafe-{{ $instanceName }}
        property: MYSQL_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "chemistry-cafe.name" . }}-backend
  labels:
    {{- include "chemistry-cafe.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ include "chemistry-cafe.name" . }}-backend
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: {{ $baoUser }}/chemistry-cafe-{{ $instanceName }}
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: {{ $baoUser }}/chemistry-cafe-{{ $instanceName }}
        property: GOOGLE_CLIENT_SECRET
    - secretKey: ORCID_CLIENT_ID
      remoteRef:
        key: {{ $baoUser }}/chemistry-cafe-{{ $instanceName }}
        property: ORCID_CLIENT_ID
    - secretKey: ORCID_CLIENT_SECRET
      remoteRef:
        key: {{ $baoUser }}/chemistry-cafe-{{ $instanceName }}
        property: ORCID_CLIENT_SECRET