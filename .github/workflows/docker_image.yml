name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set Short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push backend Docker image (latest)
      #if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ghcr.io/ncar/chemistry-cafe-backend:${{ env.SHORT_SHA }},ghcr.io/ncar/chemistry-cafe-backend:latest

    - name: Build and push backend Docker image (tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ghcr.io/ncar/chemistry-cafe-backend:${{ github.ref_name }}

    - name: Build and push frontend Docker image (latest)
      #if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ghcr.io/ncar/chemistry-cafe-frontend:${{ env.SHORT_SHA }},ghcr.io/ncar/chemistry-cafe-frontend:latest
        secrets: |
          VITE_BASE_URL=${{ secrets.DEV_VITE_BASE_URL }}

    - name: Build and push frontend Docker image (tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ghcr.io/ncar/chemistry-cafe-frontend:${{ github.ref_name }}
        secrets: |
          VITE_BASE_URL=${{ secrets.DEV_VITE_BASE_URL }}

  update-dev-deployment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set Short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Update Helm Image Tag
      run: |
        yq -i -y '.imageTag = "${{ env.SHORT_SHA }}"' chart/values-dev.yaml
        git config --global user.name "CI Bot"
        git config --global user.email "ci-bot@example.com"
        git add chart/values-dev.yaml
        git commit -m "chore(deploy): update dev image tag to ${{ env.SHORT_SHA }}"
        git push origin HEAD:main
